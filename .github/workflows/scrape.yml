name: scrape

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe / list / details / all"
        default: "probe"
  schedule:
    - cron: "17 18 * * 0"   # 每週日 18:17 UTC（台灣週一 02:17）自動跑 list + details

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run
        run: python iac_scrape.py ${{ github.event.inputs.mode || 'all' }}
      - name: Save data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data || true
          git diff --cached --quiet || git commit -m "data: $(date -u +%F_%H%M)"
          git pull --rebase --autostash || true
          git push
